version: 1

policy:
  ci_enabled: false
  history: latest_only
  runtime_directory: .runtime/quality
  automatic_timeouts: false
  status_tail_lines: 30
  concurrent_runs: reject
  background_survives_terminal_close: true
  deduplicate_steps_by_id: true
  dependency_failure: block_dependents
  final_item_may_be_pending_during_run: true
  post_gate_release_metadata: focused_validation
  warnings_require_final_report_justification: true
  non_downgradable_failure_classes:
    - security
    - migration_data_loss
    - production_health
    - production_isolation

base:
  - id: repository-state
    depends_on: []
    description: Validate roadmap state, branch alignment, dirty worktree expectations, and release metadata consistency.
    command: python3 tools/maintainer/check-repository
    severity: hard_fail

  - id: configuration
    depends_on: [repository-state]
    description: Validate application and environment configuration contracts.
    command: php artisan runa:doctor:config
    severity: hard_fail
  - id: configuration-templates
    depends_on: [repository-state]
    description: Validate application and environment configuration contracts.
    command: php artisan runa:doctor:templates
    severity: hard_fail

  - id: formatting
    depends_on: [repository-state]
    description: Verify repository formatting.
    command: php artisan runa:format --check
    severity: hard_fail

  - id: lint
    depends_on: [configuration]
    description: Run applicable lint checks.
    command: php artisan runa:lint
    severity: hard_fail

  - id: backend-tests
    depends_on: [configuration]
    exclusive_group: testing-state
    description: Run backend tests in parallel-safe testing isolation.
    command: python3 tools/maintainer/test-backend --parallel
    severity: hard_fail

  - id: php-static-analysis
    depends_on: [configuration]
    description: Run Larastan/PHPStan at the configured strict level.
    command: php artisan runa:analyse
    severity: hard_fail

  - id: dependency-audit
    depends_on: [configuration]
    description: Audit Composer and pnpm dependency vulnerabilities.
    command: php artisan runa:security:dependencies
    severity: hard_fail

  - id: secret-scan
    depends_on: [repository-state]
    description: Scan repository content for leaked secrets.
    command: php artisan runa:security:secrets
    severity: hard_fail

  - id: debug-residue
    depends_on: [repository-state]
    description: Reject accidental temporary debugging output and breakpoints.
    command: php artisan runa:check:debug-residue
    severity: hard_fail

  - id: quality-runner-contract
    depends_on: [repository-state]
    description: Validate graph selection, failure propagation, parallel exclusion, background locking and interruption.
    command: python3 tools/maintainer/testing/quality.py
    severity: hard_fail

  - id: maintenance-consistency
    depends_on: [repository-state]
    description: Validate maintenance backlog, deprecations, external registry, TODO links, and command documentation consistency.
    command: python3 tools/maintainer/check-maintenance
    severity: hard_fail

  - id: hook-contract
    depends_on: [configuration]
    description: Verify installed hooks and safe rejection behavior without creating permanent fixture commits.
    command: php artisan runa:doctor:hooks
    severity: hard_fail

impact_areas:
  backend: [] # Backend tests/static analysis are already in base.
  frontend:
    - id: frontend-build
      depends_on: [configuration]
      command: ./bin/pnpm run build
      severity: hard_fail

    - id: frontend-typecheck
      depends_on: [configuration]
      command: php artisan runa:typecheck
      severity: hard_fail

    - id: frontend-tests
      depends_on: [configuration]
      exclusive_group: testing-state
      command: python3 tools/maintainer/test-frontend
      severity: hard_fail

    - id: frontend-browser
      depends_on: [frontend-build, frontend-tests]
      exclusive_group: testing-state
      command: python3 tools/maintainer/test-e2e --critical
      severity: hard_fail

    - id: frontend-render-diagnostics
      depends_on: [frontend-browser]
      exclusive_group: testing-state
      command: python3 tools/maintainer/check-frontend
      severity: hard_fail

  database:
    - id: database-migrations
      depends_on: [backend-tests]
      exclusive_group: testing-state
      command: python3 tools/maintainer/check-database-migrations
      severity: hard_fail

    - id: database-constraints
      depends_on: [database-migrations]
      exclusive_group: testing-state
      command: php artisan runa:doctor:database
      severity: hard_fail

    - id: seeding-contract
      depends_on: [database-constraints]
      exclusive_group: testing-state
      description: Validate category isolation, dependency graph, idempotence and relevant development scenario coverage.
      command: php artisan runa:doctor:seeding
      severity: hard_fail

  production:
    - id: production-operation-contracts
      depends_on: [configuration]
      command: python3 tools/maintainer/testing/operations.py
      severity: hard_fail

    - id: customer-deployment-source-contracts
      depends_on: [configuration]
      command: python3 tools/maintainer/testing/customer-deployment.py
      severity: hard_fail

    - id: production-build
      execution_context: host
      depends_on: [production-compose]
      exclusive_group: production-simulation
      command: ./bin/artisan runa:production:build
      severity: hard_fail

    - id: production-compose
      execution_context: host
      depends_on: [configuration]
      exclusive_group: production-simulation
      command: ./bin/artisan runa:production:validate
      severity: hard_fail

    - id: production-health
      execution_context: host
      depends_on: [production-build]
      exclusive_group: production-simulation
      command: ./bin/artisan runa:production:self-test
      severity: hard_fail

    - id: production-ai-isolation
      execution_context: host
      depends_on: [production-health]
      exclusive_group: production-simulation
      command: ./bin/artisan runa:production:verify-ai-isolation
      severity: hard_fail

  development:
    - id: dependency-composition-contracts
      depends_on: [repository-state]
      description: Verify owner dependency composition, conflict rejection and lock preservation.
      command: python3 tools/maintainer/testing/dependencies.py
      severity: hard_fail

    - id: development-startup-contract
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/development-startup.py
      severity: hard_fail

    - id: development-stack
      depends_on: [configuration]
      command: php artisan runa:doctor:development
      severity: hard_fail

  ai_environment:
    - id: documentation-ownership-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/documentation.py
      severity: hard_fail
    - id: documentation-ownership-live
      depends_on: [configuration]
      exclusive_group: testing-state
      command: python3 tools/maintainer/testing/documentation-live.py
      severity: hard_fail
    - id: knowledge-doctor
      depends_on: [configuration]
      command: php artisan runa:knowledge:doctor
      severity: hard_fail

    - id: knowledge-evals
      depends_on: [knowledge-doctor]
      command: php artisan runa:knowledge:eval
      severity: hard_fail

    - id: boost-mcp
      depends_on: [configuration]
      command: php artisan runa:doctor:boost
      severity: hard_fail

  security:
    - id: security-review-contracts
      depends_on: [configuration]
      command: python3 tools/maintainer/testing/security.py
      severity: hard_fail

    - id: repository-container-scan
      execution_context: host
      exclusive_group: production-simulation
      depends_on: [configuration]
      depends_on_if_selected:
        [production-build, frontend-build, frontend-render-diagnostics]
      command: ./bin/artisan runa:security:trivy
      severity: hard_fail

    - id: expanded-security-review
      depends_on: [repository-container-scan]
      command: php artisan runa:security:review-changed-surface
      severity: hard_fail

  tooling:
    - id: tool-ownership-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/tool-ownership.py
      severity: hard_fail

    - id: host-executor-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/host-executor.py
      severity: hard_fail

    - id: host-executor-acceptance
      execution_context: host
      depends_on: [host-executor-contracts]
      exclusive_group: production-simulation
      command: python3 tools/maintainer/testing/host-executor-host.py
      severity: hard_fail

    - id: installation-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/installation.py
      severity: hard_fail

    - id: installation-host-acceptance
      execution_context: host
      depends_on: [installation-contracts]
      exclusive_group: production-simulation
      command: python3 tools/maintainer/testing/installation-host.py
      severity: hard_fail

    - id: bootstrap-source-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/bootstrap.py
      severity: hard_fail

    - id: repository-boundary-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/repository-boundary.py
      severity: hard_fail

    - id: management-transport-contracts
      depends_on: [repository-state]
      command: python3 tools/maintainer/testing/management.py
      severity: hard_fail

    - id: management-host-acceptance
      execution_context: host
      depends_on: [management-transport-contracts]
      command: python3 tools/maintainer/testing/management-host.py
      severity: hard_fail

    - id: tooling-help
      depends_on: [repository-state]
      command: php artisan runa:doctor:tooling
      severity: hard_fail

  documentation:
    - id: documentation-consistency
      depends_on: [repository-state]
      command: python3 tools/maintainer/check-docs
      severity: hard_fail

final:
  - id: release-metadata-contract
    depends_on: []
    description: Verify isolated release, documentation and knowledge metadata rejection contracts.
    command: python3 tools/maintainer/testing/release.py --with-docs-and-knowledge
    severity: hard_fail

  - id: version-changelog-roadmap
    depends_on: [release-metadata-contract]
    description: Validate README state, command documentation, VERSION, CHANGELOG, roadmap state, release type, and final report facts.
    command: python3 tools/maintainer/check-release
    severity: hard_fail

  - id: source-tree-cleanliness
    depends_on: []
    description: Verify no scratch/debug/bootstrap-only files remain unintentionally.
    command: python3 tools/maintainer/check-cleanliness
    severity: hard_fail

execution:
  base_and_selected_impact_areas: union
  missing_dependency: invalid_definition
  final_phase: after_all_selected_base_and_impact_steps_pass
  exclusive_groups: serialize_members
  production_simulation: isolated_from_real_deployments
  trivy_images: scan_actual_built_images_when_selected
  security_review: agent_review_evidence_required
