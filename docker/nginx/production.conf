worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    map "$request_uri|$http_accept" $runa_error_format {
        default html;
        ~^/api(?:/|\?|\|) json;
        ~*\|.*application/(?:[a-z0-9.+-]*\+)?json json;
    }
    map $http_accept_language $runa_header_language {
        default pl;
        "~*^en(?:[-,;]|$)" en;
    }
    map $arg_lang $runa_language {
        default $runa_header_language;
        pl pl;
        en en;
    }
    map $arg_theme $runa_theme {
        default system;
        light light;
        dark dark;
    }
    map $runa_error_format $runa_error_document {
        default /runa-error/pages/503-$runa_language-$runa_theme.html;
        json /runa-error/pages/503.json;
    }
    server {
        listen 8080;
        root /workspace/src/public;
        index index.php;
        include /etc/nginx/runa-security-headers.conf;
        # Runtime DNS allows fallback startup while PHP is absent and tracks replaced app IPs.
        resolver 127.0.0.11 valid=10s ipv6=off;
        error_page 502 503 504 =503 $runa_error_document;
        location ^~ /runa-error/pages/ {
            internal;
            include /etc/nginx/runa-security-headers.conf;
            add_header Retry-After 120 always;
            add_header Cache-Control "no-store, private" always;
        }
        location /runa-error/ { try_files $uri =404; }
        # The PHP front controller lives only in the app image.
        location = / { rewrite ^ /index.php last; }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location /build/assets/ { try_files $uri =404; expires 1y; }
        location /runa-storage/ {
            alias /workspace/src/storage/app/runa/public/;
            autoindex off;
            try_files $uri =404;
        }
        location /storage/ {
            alias /workspace/src/storage/app/application/public/;
            autoindex off;
        }
        location = /index.php {
            if (-f /run/runa-maintenance/enabled) { return 503; }
            include fastcgi_params;
            # Production is served through validated built-in or external HTTPS.
            fastcgi_param HTTPS on;
            fastcgi_param SCRIPT_FILENAME /workspace/src/public/index.php;
            fastcgi_param DOCUMENT_ROOT /workspace/src/public;
            set $runa_upstream app:9000;
            fastcgi_pass $runa_upstream;
            fastcgi_connect_timeout 3s;
            # Preserve all PHP-originated API/status/body contracts, including 503.
            fastcgi_intercept_errors off;
            fastcgi_hide_header X-Powered-By;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
