worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    server {
        listen 8080;
        root /workspace/public;
        index index.php;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location /build/assets/ { try_files $uri =404; expires 1y; }
        location /storage/ {
            alias /workspace/storage/app/public/;
            autoindex off;
        }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /workspace/public/index.php;
            fastcgi_param DOCUMENT_ROOT /workspace/public;
            fastcgi_pass app:9000;
            fastcgi_hide_header X-Powered-By;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
