[global]
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /fpm-ping
ping.response = pong
security.limit_extensions = .php
