name: runa-dev
services:
  app:
    image: runa-development:rm-2026-001
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        RUNA_UID: ${RUNA_UID:-1000}
        RUNA_GID: ${RUNA_GID:-1000}
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - composer-cache:/home/runa/.cache/composer
    environment:
      APP_ENV: local
      TEST_WORKERS: ${TEST_WORKERS:-4}
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-2}
    cpus: ${DEV_CPU_LIMIT:-4}
    mem_limit: ${DEV_MEMORY_LIMIT:-4G}
    stop_grace_period: 30s
  nginx:
    image: nginx:1.31.7-alpine
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./public:/workspace/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  composer-cache:
