name: runa-dev
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
x-development: &development
  image: runa-development:dev
  pull_policy: never
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      RUNA_UID: ${RUNA_UID:-1000}
      RUNA_GID: ${RUNA_GID:-1000}
  init: true
  working_dir: /workspace
  environment: &development-environment
    APP_ENV: local
    PYTHONPYCACHEPREFIX: /workspace/.runtime/python/pycache
  logging: *logging
  volumes:
    - .:/workspace
services:
  app:
    <<: *development
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - .:/workspace
      - composer-cache:/home/runa/.cache/composer
    environment:
      <<: *development-environment
      APP_ENV: local
      TEST_WORKERS: ${TEST_WORKERS:-4}
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-2}
    cpus: ${DEV_CPU_LIMIT:-4}
    mem_limit: ${DEV_MEMORY_LIMIT:-4G}
    stop_grace_period: 30s
  setup:
    <<: *development
    command: [python3, tools/application/executors/dev.py, setup, --if-needed]
    depends_on:
      app: { condition: service_healthy }
    volumes:
      - .:/workspace
      - composer-cache:/home/runa/.cache/composer
    healthcheck: { disable: true }
    restart: 'no'
    cpus: 4
    mem_limit: 4G
  knowledge-init:
    <<: *development
    command: [python3, tools/application/knowledge/startup.py, initialize]
    healthcheck: { disable: true }
    restart: on-failure
    cpus: 1
    mem_limit: 512M
  app-test:
    <<: *development
    profiles: [testing]
    env_file: .env.testing
    environment:
      <<: *development-environment
      APP_ENV: testing
      LARAVEL_STORAGE_PATH: /workspace/.runtime/src/runa/tests/e2e
    command:
      [
        sh,
        -c,
        'mkdir -p .runtime/src/runa/tests/e2e/framework/cache/data .runtime/src/runa/tests/e2e/framework/views .runtime/src/runa/tests/e2e/framework/sessions .runtime/src/runa/tests/e2e/logs && php artisan runa:test-db:guard && exec php-fpm -F',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    cpus: 1
    mem_limit: 512M
  nginx-test:
    image: nginx:1.31.7-alpine-slim@sha256:ebd058041a732a2b2dc0b606e34572dd8e0034de6a4aa4d50d8c13a240ac6005
    profiles: [testing]
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    depends_on:
      app-test: { condition: service_healthy }
    volumes:
      - ./src/public:/workspace/src/public:ro
      - ./docker/nginx/testing.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    cpus: .25
    mem_limit: 64M
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 5s
      timeout: 3s
      retries: 5
  qdrant:
    image: runa-qdrant:dev
    build:
      context: .
      dockerfile: docker/qdrant/Dockerfile
      args:
        RUNA_UID: ${RUNA_UID:-1000}
        RUNA_GID: ${RUNA_GID:-1000}
    volumes: [qdrant-data:/qdrant/storage]
    environment:
      {
        QDRANT__TELEMETRY_DISABLED: 'true',
        QDRANT__SERVICE__ENABLE_STATIC_CONTENT: 'false',
      }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
    cpus: 1
    mem_limit: 512M
  embeddings:
    image: runa-embeddings-cpu:dev
    build:
      context: .
      dockerfile: docker/embeddings/Dockerfile
      args:
        RUNA_UID: ${RUNA_UID:-1000}
        RUNA_GID: ${RUNA_GID:-1000}
    command:
      [
        --model-id,
        BAAI/bge-small-en-v1.5,
        --revision,
        5c38ec7c405ec4b44b94cc5a9bb96e735b38267a,
        --dtype,
        float32,
        --auto-truncate,
        'false',
        --pooling,
        cls,
        --port,
        '8080',
        --max-client-batch-size,
        '16',
        --max-batch-tokens,
        '8192',
        --tokenization-workers,
        '2',
        --json-output,
      ]
    environment: { RAYON_NUM_THREADS: '2', OMP_NUM_THREADS: '2' }
    volumes: [embedding-cache:/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
    cpus: 2
    mem_limit: 2G
  postgres:
    image: runa-postgres:dev
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    env_file: .env.dev.database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=pl-PL
    volumes:
      - postgres-icu-data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-runa.sh:ro
    logging: *logging
    cpus: 1
    mem_limit: 512M
    healthcheck:
      test:
        [
          CMD-SHELL,
          'PGPASSWORD="$$APP_DB_PASSWORD" psql -h 127.0.0.1 -U runa -d runa -tAc "SELECT 1" | grep -qx 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  mailpit:
    image: runa-mailpit:dev
    build:
      context: .
      dockerfile: docker/mailpit/Dockerfile
      args:
        RUNA_UID: ${RUNA_UID:-1000}
        RUNA_GID: ${RUNA_GID:-1000}
    environment:
      {
        MP_DATABASE: /data/mailpit.db,
        MP_MAX_MESSAGES: '500',
        MP_ALLOWED_HOSTS: 'localhost,127.0.0.1,mailpit',
      }
    volumes: [mailpit-data:/data]
    ports: ['127.0.0.1:8025:8025']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    cpus: .25
    mem_limit: 128M
  queue:
    <<: *development
    command:
      [
        sh,
        -c,
        'php artisan runa:config:validate && exec php artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=192 --max-time=3600 --no-interaction',
      ]
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 75s
    cpus: 1
    mem_limit: 512M
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', queue]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  scheduler:
    <<: *development
    command:
      [
        sh,
        -c,
        'php artisan runa:config:validate && exec php artisan schedule:work --no-interaction',
      ]
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 75s
    cpus: .25
    mem_limit: 128M
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', scheduler]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
  nginx:
    image: nginx:1.31.7-alpine-slim@sha256:ebd058041a732a2b2dc0b606e34572dd8e0034de6a4aa4d50d8c13a240ac6005
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    depends_on:
      app: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./src/public:/workspace/src/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    cpus: .25
    mem_limit: 64M
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  composer-cache:
  postgres-icu-data:
  mailpit-data:
  qdrant-data:
  embedding-cache:
