name: runa-dev
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-development: &development
  image: runa-development:rm-2026-001
  pull_policy: never
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      RUNA_UID: ${RUNA_UID:-1000}
      RUNA_GID: ${RUNA_GID:-1000}
  init: true
  working_dir: /workspace
  environment: {APP_ENV: local}
  logging: *logging
  volumes:
    - .:/workspace
services:
  app:
    <<: *development
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - .:/workspace
      - composer-cache:/home/runa/.cache/composer
    environment:
      APP_ENV: local
      TEST_WORKERS: ${TEST_WORKERS:-4}
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-2}
    cpus: ${DEV_CPU_LIMIT:-4}
    mem_limit: ${DEV_MEMORY_LIMIT:-4G}
    stop_grace_period: 30s
  setup:
    <<: *development
    command: [./bin/dev, setup, --if-needed]
    depends_on:
      app: {condition: service_healthy}
    volumes:
      - .:/workspace
      - composer-cache:/home/runa/.cache/composer
    healthcheck: {disable: true}
    restart: 'no'
    cpus: 4
    mem_limit: 4G
  postgres:
    image: postgres:18.6-bookworm
    env_file: .env.dev.database
    environment: {POSTGRES_USER: postgres, POSTGRES_DB: postgres, TZ: UTC}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-runa.sh:ro
    logging: *logging
    cpus: 1
    mem_limit: 512M
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$APP_DB_PASSWORD" psql -h 127.0.0.1 -U runa -d runa -tAc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  mailpit:
    image: runa-mailpit:rm-2026-001
    build:
      context: .
      dockerfile: docker/mailpit/Dockerfile
      args:
        RUNA_UID: ${RUNA_UID:-1000}
        RUNA_GID: ${RUNA_GID:-1000}
    environment: {MP_DATABASE: /data/mailpit.db, MP_MAX_MESSAGES: '500', MP_ALLOWED_HOSTS: 'localhost,127.0.0.1,mailpit'}
    volumes: [mailpit-data:/data]
    ports: ['127.0.0.1:8025:8025']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    cpus: .25
    mem_limit: 128M
  queue:
    <<: *development
    command: [sh, -c, 'php artisan runa:config:validate && exec php artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=192 --max-time=3600 --no-interaction']
    depends_on:
      setup: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 75s
    cpus: 1
    mem_limit: 512M
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', queue]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  scheduler:
    <<: *development
    command: [sh, -c, 'php artisan runa:config:validate && exec php artisan schedule:work --no-interaction']
    depends_on:
      setup: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 75s
    cpus: .25
    mem_limit: 128M
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', scheduler]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
  nginx:
    image: nginx:1.31.7-alpine
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    depends_on:
      app: {condition: service_healthy}
      setup: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./public:/workspace/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    cpus: .25
    mem_limit: 64M
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  composer-cache:
  postgres-data:
  mailpit-data:
