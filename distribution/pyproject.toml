[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "runa-external-tooling"
dynamic = ["version"]
description = "Private standalone Runa acquisition and update bundle"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["distribution", "tools", "tools.core"]
include-package-data = false

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
distribution = ["module-plan.php", "platform-database.php"]
