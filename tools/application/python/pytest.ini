[pytest]
minversion = 9.1
python_files = test_*.py
addopts = --import-mode=importlib --strict-config --strict-markers -ra
cache_dir = .runtime/python/cache/pytest
markers =
    docker: requires explicitly provisioned owned Docker resources
    network: requires network access
    knowledge: requires the isolated knowledge stack
    database: requires disposable database workers under the suite lock
    packaging: builds and projects private artifacts
