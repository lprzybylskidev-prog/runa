version: 1
base:
  - id: application-config
    depends_on: []
    command: php artisan runa:config:validate
    severity: hard_fail
  - id: application-config-templates
    depends_on: []
    command: php artisan runa:config:templates
    severity: hard_fail
  - id: application-format
    depends_on: [application-config]
    command: php artisan runa:format --check
    severity: hard_fail
  - id: application-lint
    depends_on: [application-config]
    command: php artisan runa:lint
    severity: hard_fail
  - id: application-types
    depends_on: [application-config]
    command: php artisan runa:typecheck
    severity: hard_fail
  - id: application-tests
    depends_on: [application-config]
    command: php artisan runa:test
    exclusive_group: testing-state
    severity: hard_fail
  - id: application-docs
    depends_on: [application-config]
    command: php artisan runa:doctor:docs
    severity: hard_fail
  - id: application-analysis
    depends_on: [application-config]
    command: php artisan runa:analyse
    severity: hard_fail
  - id: application-secrets
    depends_on: [application-config]
    command: php artisan runa:security:secrets
    severity: hard_fail
impact_areas:
  backend:
    - id: application-module-contracts
      depends_on: [application-config]
      command: php artisan runa:modules:check app
      severity: hard_fail
    - id: application-module-versions
      depends_on: [application-config]
      command: python3 tools/application/module_versions.py --owner app
      severity: hard_fail
  frontend: []
  database: []
  development: []
  production: []
  tooling:
    - id: application-python-setup
      depends_on: [application-config]
      command: php artisan runa:python:setup
      exclusive_group: testing-state
      severity: hard_fail
    - id: application-python-format
      depends_on: [application-python-setup]
      command: php artisan runa:python:format --check
      exclusive_group: testing-state
      severity: hard_fail
    - id: application-python-lint
      depends_on: [application-python-setup]
      command: php artisan runa:python:lint
      exclusive_group: testing-state
      severity: hard_fail
    - id: application-python-types
      depends_on: [application-python-setup]
      command: php artisan runa:python:typecheck
      exclusive_group: testing-state
      severity: hard_fail
  security: []
  ai_environment: []
  documentation: []
final:
  - id: application-container-security
    depends_on: []
    execution_context: host
    command: ./bin/artisan runa:security:trivy
    severity: hard_fail
  - id: application-dependencies
    depends_on: []
    command: php artisan runa:security:dependencies
    severity: hard_fail
  - id: application-knowledge-doctor
    exclusive_group: knowledge-state
    depends_on: []
    command: php artisan runa:knowledge:doctor
    severity: hard_fail
  - id: application-knowledge-eval
    exclusive_group: knowledge-state
    depends_on: []
    command: php artisan runa:knowledge:eval
    severity: hard_fail

mandatory:
  [
    application-repository,
    application-config,
    application-config-templates,
    application-docs,
    application-secrets,
    application-debug-residue,
    application-knowledge-freshness,
  ]
groups:
  docs: [application-docs]
  tooling:
    [
      application-tooling,
      application-python-format,
      application-python-lint,
      application-python-types,
    ]
  backend:
    [
      application-tests,
      application-analysis,
      application-module-contracts,
      application-module-versions,
      application-format,
      application-lint,
    ]
  frontend:
    [
      application-build,
      application-types,
      application-frontend-tests,
      application-format,
      application-lint,
    ]
  e2e: [application-e2e, application-frontend-diagnostics]
  database:
    [application-database-migrations, application-database, application-seeding]
  development: [application-development, application-hooks]
  containers: [application-container-security]
  security: [application-dependencies, application-container-security]
  knowledge:
    [
      application-knowledge-doctor,
      application-knowledge-eval,
      application-boost,
    ]

group_steps:
  - id: application-repository
    depends_on: []
    command: php artisan runa:doctor:repository
    severity: hard_fail
  - id: application-debug-residue
    depends_on: [application-config]
    command: php artisan runa:check:debug-residue
    severity: hard_fail
  - id: application-knowledge-freshness
    exclusive_group: knowledge-state
    depends_on: [application-config]
    command: php artisan runa:knowledge:stale
    severity: hard_fail
  - id: application-tooling
    depends_on: [application-config]
    command: php artisan runa:doctor:tooling
    severity: hard_fail
  - id: application-build
    depends_on: [application-config]
    command: ./bin/pnpm run build
    severity: hard_fail
  - id: application-frontend-tests
    depends_on: [application-config]
    command: php artisan runa:test:frontend
    severity: hard_fail
    exclusive_group: testing-state
  - id: application-e2e
    depends_on: [application-build, application-frontend-tests]
    command: ./bin/artisan runa:test:e2e
    severity: hard_fail
    exclusive_group: testing-state
    execution_context: host
  - id: application-frontend-diagnostics
    depends_on: [application-e2e]
    command: php artisan runa:doctor:frontend
    severity: hard_fail
    exclusive_group: testing-state
  - id: application-database-migrations
    depends_on: [application-tests]
    command: php artisan runa:doctor:database-migrations
    severity: hard_fail
    exclusive_group: testing-state
  - id: application-database
    depends_on: [application-database-migrations]
    command: php artisan runa:doctor:database
    severity: hard_fail
    exclusive_group: testing-state
  - id: application-seeding
    depends_on: [application-database]
    command: php artisan runa:doctor:seeding
    severity: hard_fail
    exclusive_group: testing-state
  - id: application-development
    exclusive_group: knowledge-state
    depends_on: [application-config]
    command: php artisan runa:doctor:development
    severity: hard_fail
  - id: application-hooks
    exclusive_group: knowledge-state
    depends_on: [application-config]
    command: php artisan runa:doctor:hooks
    severity: hard_fail
  - id: application-boost
    depends_on: [application-config]
    command: php artisan runa:doctor:boost
    severity: hard_fail
