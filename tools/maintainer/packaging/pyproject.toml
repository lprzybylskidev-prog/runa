[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "runa-maintainer-tooling"
dynamic = ["version"]
description = "Private Runa owner tooling layered on application tooling"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["tools.maintainer", "tools.maintainer.localization", "tests.tools.runa.acceptance", "tests", "tests.tools", "tests.tools.runa", "tests.tools.runa.support", "tests.tools.runa.unit", "tests.tools.runa.contracts", "tests.tools.runa.integration", "tests.tools.runa.e2e"]
include-package-data = false

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
"tools.maintainer" = ["hook", "knowledge.json", "knowledge-golden.json", "python/ruff.toml", "python/pyrightconfig.json"]
"tests.tools.runa.acceptance" = ["fixtures/python-command-contracts.json", "fixtures/installation-smtp.py", "localization.php", "runtime.php"]
