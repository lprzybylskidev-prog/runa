# Runtime foundation. Production operations and remaining services are completed
# in roadmap points 13–14; this is not yet a deployable production stack.
name: runa-prod
services:
  app:
    image: runa-production:rm-2026-001
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      KNOWLEDGE_ENABLED: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    init: true
    volumes:
      - application-storage:/workspace/storage
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:18.6-bookworm
    env_file: .env.prod.database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-runa.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$APP_DB_PASSWORD" psql -h 127.0.0.1 -U runa -d runa -tAc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  queue:
    image: runa-production:rm-2026-001
    env_file: .env.prod
    environment: {APP_ENV: production, APP_DEBUG: 'false', KNOWLEDGE_ENABLED: 'false'}
    init: true
    command: [sh, -c, 'php artisan runa:config:validate && exec php artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=192 --max-time=3600 --no-interaction']
    volumes: [application-storage:/workspace/storage]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 75s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', queue]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  scheduler:
    image: runa-production:rm-2026-001
    env_file: .env.prod
    environment: {APP_ENV: production, APP_DEBUG: 'false', KNOWLEDGE_ENABLED: 'false'}
    init: true
    command: [sh, -c, 'php artisan runa:config:validate && exec php artisan schedule:work --no-interaction']
    volumes: [application-storage:/workspace/storage]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 75s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', scheduler]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
  nginx:
    image: runa-nginx:rm-2026-001
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production-nginx
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  application-storage:
  postgres-data:
