name: runa-prod
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
x-application: &application
  image: runa-production:${RUNA_IMAGE_TAG:?Set an exact release or commit image tag}
  pull_policy: never
  env_file: [{ path: .env.prod, format: raw }]
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    KNOWLEDGE_ENABLED: 'false'
    QUEUE_CONNECTION: database
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    - /workspace/src/bootstrap/cache:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0770
  volumes:
    - application-storage:/workspace/src/storage
  depends_on:
    postgres: { condition: service_healthy }
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  app:
    <<: *application
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    cpus: 2
    mem_limit: 2G
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, runa-fpm-health]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  postgres:
    image: runa-postgres:${RUNA_IMAGE_TAG:?Set an exact release or commit image tag}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    pull_policy: never
    env_file: [{ path: .env.prod.database, format: raw }]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=pl-PL
      TZ: UTC
    volumes:
      - postgres-icu-data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-runa.sh:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'PGPASSWORD="$$APP_DB_PASSWORD" psql -h 127.0.0.1 -U runa -d runa -tAc "SELECT 1" | grep -qx 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2
    mem_limit: 2G
    security_opt: [no-new-privileges:true]
    logging: *logging
  queue:
    <<: *application
    command:
      [
        php,
        artisan,
        'queue:work',
        database,
        '--sleep=3',
        '--tries=3',
        '--timeout=60',
        '--memory=192',
        '--max-time=3600',
        '--no-interaction',
      ]
    cpus: 1
    mem_limit: 512M
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', queue]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  scheduler:
    <<: *application
    command: [php, artisan, 'schedule:work', '--no-interaction']
    cpus: .5
    mem_limit: 256M
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, php, artisan, 'runa:runtime:health', scheduler]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
  nginx:
    image: runa-nginx:${RUNA_IMAGE_TAG:?Set an exact release or commit image tag}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production-nginx
    depends_on:
      app: { condition: service_healthy }
    ports:
      - '127.0.0.1:${RUNA_HTTP_PORT:-8081}:8080'
    group_add: ['1000']
    volumes:
      - type: volume
        source: application-storage
        target: /workspace/src/storage/app/application/public
        read_only: true
        volume: { subpath: app/application/public }
      - type: volume
        source: application-storage
        target: /workspace/src/storage/app/runa/public
        read_only: true
        volume: { subpath: app/runa/public }
      - type: volume
        source: application-storage
        target: /run/runa-maintenance
        read_only: true
        volume: { subpath: framework/maintenance }
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    cpus: .5
    mem_limit: 128M
    stop_grace_period: 30s
    logging: *logging
volumes:
  application-storage:
  postgres-icu-data:
