# Runtime foundation. Production operations and remaining services are completed
# in roadmap points 13–14; this is not yet a deployable production stack.
name: runa-prod
services:
  app:
    image: runa-production:rm-2026-001
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      KNOWLEDGE_ENABLED: 'false'
    init: true
    volumes:
      - application-storage:/workspace/storage
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  nginx:
    image: runa-nginx:rm-2026-001
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  application-storage:
